name: Snyk Security

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  snyk:
    uses: activeprospect/github-action-workflows/.github/workflows/snyk.yml@master
    with:
      setup_node: false
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
